server {
    listen 80;
    server_name _;

    # Serve built React SPA
    root /usr/share/nginx/html;
    index index.html;

    # The app shell must never be cached, or phones keep running an old version
    # after a deploy. Built assets have hashed names, so they can be cached forever.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Node backend
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20M;
}
