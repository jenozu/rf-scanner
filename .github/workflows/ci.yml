name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Server tests
        run: npm test
        working-directory: server
