name: VPS check

# Read-only health report of the VPS, every morning and on demand. Changes nothing.
# Opens (or adds to) ONE GitHub issue labelled "vps-alert" when something fails, and
# closes it again when the next check passes.
# Setup (once): docs/GITHUB_ACTIONS_VPS_GUIDE.md. Until the secrets exist this skips quietly.

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 6:17 am Toronto (7:17 am in summer)
  workflow_dispatch:

concurrency:
  group: vps-deploy      # never overlap a deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Are the VPS secrets set?
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::notice::VPS secrets are not set up yet, so nothing was checked. See docs/GITHUB_ACTIONS_VPS_GUIDE.md."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the check on the VPS
        if: steps.cfg.outputs.go == 'yes'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "check"

      - name: Raise an alert issue
        if: failure()
        run: |
          set -euo pipefail
          # The issue links to this run instead of copying output into it: the repository is public.
          gh label create vps-alert --color B60205 --description "VPS deploy or check failed" 2>/dev/null || true
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The VPS health check failed. Which checks failed (PASS/WARN/FAIL lines): ${url}"
          n="$(gh issue list --label vps-alert --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "VPS deploy or check failed" --label vps-alert --body "$body"; fi

      - name: Close the alert once healthy again
        if: success() && steps.cfg.outputs.go == 'yes'
        run: |
          set -euo pipefail
          for n in $(gh issue list --label vps-alert --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The VPS check passed again (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          done
