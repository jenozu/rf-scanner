services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - rf_data:/app/server/data
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/server/data

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      # Persistent host folder for master inventory files.
      # Put master_inventory.xlsx in /docker/rf-scanner/data on the VPS.
      - ./data:/usr/share/nginx/html/data:ro
    depends_on:
      - api

volumes:
  rf_data:
